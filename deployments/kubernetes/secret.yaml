apiVersion: v1
kind: Secret
metadata: { name: cbt-secret, namespace: cbt }
type: Opaque
stringData:
  DATABASE_URL: postgres://cbt:change-me@postgres-ha:5432/cbt?sslmode=require
  POSTGRES_READ_DATABASE_URL: postgres://cbt:change-me@postgres-read:5432/cbt?sslmode=require
  REDIS_PASSWORD: change-me
  RABBITMQ_URL: amqp://cbt:change-me@rabbitmq:5672/
  JWT_ACCESS_SECRET: change-me-access-secret-64-bytes-minimum
  JWT_REFRESH_SECRET: change-me-refresh-secret-64-bytes-minimum
  REQUEST_SIGNING_SECRET: change-me
  ENCRYPTION_KEY: change-me-32-byte-key
  S3_ACCESS_KEY: change-me
  S3_SECRET_KEY: change-me
