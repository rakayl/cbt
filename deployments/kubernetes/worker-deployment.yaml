apiVersion: apps/v1
kind: Deployment
metadata: { name: cbt-worker, namespace: cbt }
spec:
  replicas: 3
  selector: { matchLabels: { app: cbt-worker } }
  template:
    metadata: { labels: { app: cbt-worker } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/enterprise-cbt/worker:latest
          envFrom:
            - configMapRef: { name: cbt-config }
            - secretRef: { name: cbt-secret }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
