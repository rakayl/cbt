apiVersion: v1
kind: Service
metadata: { name: cbt-backend, namespace: cbt }
spec:
  selector: { app: cbt-backend }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: cbt-frontend, namespace: cbt }
spec:
  selector: { app: cbt-frontend }
  ports: [{ name: http, port: 80, targetPort: 80 }]
